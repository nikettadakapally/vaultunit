spring.application.name=vaultunit-api
server.port=${PORT:8080}
vaultunit.opening-balance=0.00
server.servlet.session.timeout=3650d
server.servlet.session.cookie.max-age=3650d
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3650d
spring.datasource.url=${VAULTUNIT_DB_URL:jdbc:h2:file:../backend/vaultunit-data;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
